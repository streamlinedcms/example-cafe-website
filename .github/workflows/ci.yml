name: CI

on:
    pull_request:
        branches: [master, develop]

# A newer push to the same pull request cancels the run still in progress
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build
